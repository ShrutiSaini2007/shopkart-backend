spring.application.name=shopkart-backend

# ---- Local default: H2 in-memory DB (no setup needed to run locally) ----
spring.datasource.url=jdbc:h2:mem:shopkart;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# ---- On Render, override via environment variables instead of editing this file: ----
# SPRING_DATASOURCE_URL=jdbc:postgresql://<host>/<db>
# SPRING_DATASOURCE_USERNAME=<user>
# SPRING_DATASOURCE_PASSWORD=<password>
# SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
# JWT_SECRET=<a long random string>
